included:
  - Tonegen
  - Tests

excluded:
  - Tonegen/Resources

disabled_rules:
  - trailing_whitespace        # swiftformat handles this
  - closure_parameter_position # conflicts with swiftformat's capture-list formatting
  - inclusive_language         # "master" is standard audio engineering terminology

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 100
  error: 140
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 70
  error: 120

identifier_name:
  min_length: 2
  excluded:
    - id
    - db
    - hz
    - sr
    - L
    - R
    - r
    - g
    - b
    - s
    - p
    - v
    - w
    - x
    - y
    - i
    - n
    - q
    - t
    - h
    - k
    - f

function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 3
  error: 4
