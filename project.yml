name: Tonegen

options:
  bundleIdPrefix: com.tonegen
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  groupOrdering:
    - pattern: App
    - pattern: State
    - pattern: Engine
    - pattern: UI
    - pattern: Helpers
    - pattern: Resources

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

targets:
  Tonegen:
    type: application
    platform: iOS
    sources:
      - path: Tonegen
        excludes:
          - "**/.DS_Store"
          - "**/.git/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonegen.app
        INFOPLIST_FILE: Tonegen/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # Increment CURRENT_PROJECT_VERSION before each TestFlight upload (agvtool next-version -all)
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
      Debug:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      Release:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  TonegenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TonegenTests
    dependencies:
      - target: Tonegen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonegen.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tonegen.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tonegen

  TonegenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TonegenUITests
    dependencies:
      - target: Tonegen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonegen.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tonegen

schemes:
  Tonegen:
    build:
      targets:
        Tonegen: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TonegenTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # UI-test-driven App Store screenshots. Kept out of the main scheme so
  # `xcodebuild test` stays fast.
  TonegenScreenshots:
    build:
      targets:
        Tonegen: all
        TonegenUITests: [test]
    test:
      config: Debug
      targets:
        - TonegenUITests
